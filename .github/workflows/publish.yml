name: Refresh player data and static mirror

on:
  workflow_dispatch:
  schedule:
    # Once a day. This job now only maintains slow-moving data: the pruned
    # player dictionary the live renderer joins against, plus a static mirror.
    # Anything volatile is fetched per request by the Vercel function, so there
    # is nothing here that benefits from running more often.
    - cron: "20 9 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish.yml"

# Needed to commit data/players.json and the static mirror back to main. The
# push also triggers a Vercel redeploy, which is how the live site picks up a
# refreshed player dictionary.
permissions:
  contents: write

concurrency:
  group: refresh-league-data
  cancel-in-progress: false

env:
  SLEEPER_LEAGUE_ID: "1359238964875132928"
  SLEEPER_USER_ID: "1260412048202813440"
  SITE_URL: "https://sambilletdeaux.github.io/sleeper-league-sync"
  LIVE_URL: "https://kingkings.vercel.app"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Date-stamp the player cache key
        id: cachekey
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Sleeper asks that /players/nfl (~16 MB) be called at most once a day.
      # A date-keyed cache with no restore-keys gives exactly that.
      - name: Restore player map cache
        uses: actions/cache@v4
        with:
          path: .cache/players_nfl.json
          key: sleeper-players-${{ steps.cachekey.outputs.date }}

      # ~16 MB of players down to the ~1,000 this league could reference.
      # Everything the live renderer knows about a player comes from this file.
      - name: Prune the player dictionary
        run: python3 scripts/prune_players.py --out data/players.json | tee build.log

      # A fallback that keeps working if Vercel or Sleeper is unavailable.
      - name: Build the static mirror
        run: python3 scripts/build.py --out . | tee -a build.log

      - name: Commit and push
        run: |
          git config user.name "sleeper-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json index.html league.md league.html league.json .nojekyll
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git commit -m "Refresh league data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin/main and retrying."
            git pull --rebase origin main || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push the refreshed data after 4 attempts."
          exit 1

      # The live site is the product; a green job that leaves it broken is worse
      # than a red one, so fail here if it is not actually serving the brief.
      - name: Check the live site is serving the brief
        run: |
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' "$LIVE_URL/" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$LIVE_URL/ returned $code"
            exit 1
          fi
          if ! grep -q "roster_id" /tmp/live.html; then
            echo "::error::$LIVE_URL/ returned 200 but contains no league data"
            exit 1
          fi
          echo "Live site OK ($(wc -c < /tmp/live.html) bytes)."

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Sleeper league data refresh'
            echo ''
            echo '```'
            cat build.log 2>/dev/null || echo 'build produced no output'
            echo '```'
            echo ''
            echo "Live brief: ${LIVE_URL}"
            echo ''
            echo "Static mirror: ${SITE_URL}/league.html"
          } >> "$GITHUB_STEP_SUMMARY"
