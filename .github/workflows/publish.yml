name: Publish league brief

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. The league is not volatile enough to warrant more, and
    # anything genuinely live is fetched from Sleeper by the reader instead.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish.yml"

# Needed to commit the rebuilt brief back to main, which is what GitHub Pages
# serves. See README for why this publishes by commit rather than by artifact.
permissions:
  contents: write

concurrency:
  group: publish-league-brief
  cancel-in-progress: false

env:
  SLEEPER_LEAGUE_ID: "1359238964875132928"
  SLEEPER_USER_ID: "1260412048202813440"
  SITE_URL: "https://sambilletdeaux.github.io/sleeper-league-sync"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Date-stamp the player cache key
        id: cachekey
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Sleeper asks that /players/nfl (~5 MB) be called at most once a day.
      # A date-keyed cache with no restore-keys gives exactly that: the first
      # run each day misses and refetches, the rest of the day hits.
      - name: Restore player map cache
        uses: actions/cache@v4
        with:
          path: .cache/players_nfl.json
          key: sleeper-players-${{ steps.cachekey.outputs.date }}

      # Writes index.html, league.md, league.json and .nojekyll to the repo
      # root, which is the directory Pages serves.
      - name: Build brief
        run: python3 scripts/build.py --out . | tee build.log

      - name: Commit and push
        run: |
          git config user.name "sleeper-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html league.md league.json .nojekyll
          if git diff --cached --quiet; then
            echo "Brief unchanged since last run; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh league brief ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin/main and retrying."
            git pull --rebase origin main || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push the refreshed brief after 4 attempts."
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Sleeper league brief'
            echo ''
            echo '```'
            cat build.log 2>/dev/null || echo 'build produced no output'
            echo '```'
            echo ''
            echo "Published to ${SITE_URL}/league.md"
          } >> "$GITHUB_STEP_SUMMARY"
